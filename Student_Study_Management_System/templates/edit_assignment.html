<!DOCTYPE html>
<html>
<head>
    <title>Edit Assignment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="main-content">
    <div class="top-profile">
    {% if top_profile_picture %}
        <img src="{{ url_for('static', filename='profile_uploads/' ~ top_profile_picture) }}">
    {% else %}
        <div class="profile-placeholder">👤</div>
    {% endif %}

    <span>{{ top_profile_username }}</span>
</div>

    <h1>Edit Assignment</h1>

    <form method="POST">

        <label>Assignment Name:</label>
        <input type="text" name="title" value="{{ item[2] }}" required>

        <br><br>

        <label>Subject:</label>
        <input type="text" name="subject" value="{{ item[3] }}" required>

        <br><br>

        <label>Due Date:</label>
        <input type="date" name="due_date" value="{{ item[4] }}" required>

        <br><br>

        <label>Priority:</label>
        <select name="priority" required>
            <option value="High" {% if item[5] == 'High' %}selected{% endif %}>High</option>
            <option value="Medium" {% if item[5] == 'Medium' %}selected{% endif %}>Medium</option>
            <option value="Low" {% if item[5] == 'Low' %}selected{% endif %}>Low</option>
        </select>

        <br><br>

        <button type="submit">Update Assignment</button>

    </form>

    <br>
    <a href="/assignments">Back to Assignments</a>

</div>

</body>
</html>
